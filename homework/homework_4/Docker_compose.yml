services:
  # Веб-сервер Nginx
  web:
    image: nginx:latest
    container_name: nginx_web
    ports:
      - "8080:80"          # хост:контейнер
    depends_on:
      - redis
      - mysql
    networks:
      - mynetwork
    restart: unless-stopped

  # Хранилище Redis
  redis:
    image: redis:latest
    container_name: redis_cache
    networks:
      - mynetwork
    restart: unless-stopped

  # База данных MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql   # файлы БД сохраняются в volume
    networks:
      - mynetwork
    restart: unless-stopped

# Именованный volume для данных MySQL
volumes:
  mysql_data:

# Общая сеть для всех контейнеров
networks:
  mynetwork:
    driver: bridge
